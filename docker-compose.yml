services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficinamecanica-api:latest
    container_name: oficinamecanica-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      ConnectionStrings__DefaultConnection: "Server=tcp:sqlserver,1433;Database=OficinaMecanicaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
      JwtSettings__Issuer: "OficinaMecanica.Seguranca"
      JwtSettings__Audience: "OficinaMecanica.Client"
      # Aponta pro OficinaMecanica.Seguranca RODANDO LOCAL 
      JwtSettings__JwksUri: "http://host.docker.internal:7071/.well-known/jwks.json"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__Remetente: "no-reply@oficinamecanica.local"
      Otel__Endpoint: "http://jaeger:4317"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oficinamecanica-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: oficinamecanica-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: oficinamecanica-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: oficinamecanica-prometheus
    volumes:
      - ./local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: oficinamecanica-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./local/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: oficinamecanica-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.river"]
    volumes:
      - ./local/alloy-config.river:/etc/alloy/config.river:ro
      - //var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: oficinamecanica-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    volumes:
      - ./local/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    container_name: oficinamecanica-sonar
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD}"
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  sonarqube-db:
    image: postgres:15
    container_name: oficinamecanica-sonar-db
    environment:
      POSTGRES_USER: "${SONAR_DB_USER}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD}"
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trivy:
    image: aquasec/trivy:latest
    container_name: oficinamecanica-trivy
    profiles: ["security"]
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/trivy
      - ./docs:/reports
    command: >
      image
      --format json
      --output /reports/trivy-report-raw.json
      --severity CRITICAL,HIGH,MEDIUM
      oficinamecanica-api:latest
    depends_on:
      - api
    restart: "no"

  sonar-setup:
    image: alpine:3.19
    container_name: oficinamecanica-sonar-setup
    depends_on:
      sonarqube:
        condition: service_healthy
    restart: "no"
    environment:
      SONAR_ADMIN_PASSWORD: "${SONAR_ADMIN_PASSWORD}"
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1

        echo "==> Configurando SonarQube..."

        # Troca de senha (ignorado se ja alterada)
        curl -s -u admin:admin -X POST "http://sonarqube:9000/api/users/change_password" \
          -d "login=admin&previousPassword=admin&password=$$SONAR_ADMIN_PASSWORD" > /dev/null 2>&1 || true

        # Criacao do projeto (idempotente)
        curl -s -u admin:$$SONAR_ADMIN_PASSWORD -X POST "http://sonarqube:9000/api/projects/create" \
          -d "project=oficina-mecanica&name=OficinaMecanica&visibility=public" > /dev/null 2>&1 || true

        echo "==> SonarQube pronto!"
        echo "    Dashboard: http://localhost:9000/dashboard?id=oficina-mecanica"
        echo "    Login: admin / $$SONAR_ADMIN_PASSWORD"

volumes:
  sqlserver_data:
  prometheus_data:
  loki_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
  trivy_cache:
