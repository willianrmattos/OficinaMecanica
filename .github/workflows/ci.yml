name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OficinaMecanica.sln

      - name: Build
        run: dotnet build OficinaMecanica.sln --no-restore --configuration Release

      - name: Test - Domain
        run: dotnet test tests/OficinaMecanica.Domain.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=domain-tests.trx" --results-directory TestResults

      - name: Test - Application
        run: dotnet test tests/OficinaMecanica.Application.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=application-tests.trx" --results-directory TestResults

      - name: Test - Integration
        run: dotnet test tests/OficinaMecanica.Integration.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados dos Testes
          path: "TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload test result artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrfiap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            acrfiap.azurecr.io/oficinamecanica-api:${{ github.sha }}
            acrfiap.azurecr.io/oficinamecanica-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Usei admin: true pra buscar o kubeconfig via credenciais de
      # administrador do cluster (contas locais, nao Azure RBAC de
      # autorizacao dentro do Kubernetes) - exige a role "Azure Kubernetes
      # Service Cluster Admin Role" (infra/github_oidc/main.tf) no Service
      # Principal do GitHub Actions.
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rgfiap
          cluster-name: aksfiap
          admin: true

      # O API server do AKS tem authorized_ip_ranges restrito ao IP de casa
      # (infra/terraform.tfvars) - o runner do GitHub Actions usa um IP
      # dinamico e efemero, fora dessa lista, e sem isso o "kubectl apply"
      # abaixo nem alcanca o cluster (timeout de rede). Libero
      # temporariamente o IP deste runner, guardando a lista original em
      # AKS_ORIGINAL_IP_RANGES pra restaurar no final do job. Exige a role
      # "Azure Kubernetes Service Contributor Role" (infra/github_oidc/main.tf)
      # no Service Principal do GitHub Actions.
      - name: Libera IP do runner no API server do AKS
        run: |
          CURRENT_RANGES=$(az aks show --resource-group rgfiap --name aksfiap --query "join(',', apiServerAccessProfile.authorizedIpRanges)" -o tsv)
          echo "AKS_ORIGINAL_IP_RANGES=$CURRENT_RANGES" >> "$GITHUB_ENV"
          RUNNER_IP=$(curl -s https://ifconfig.me)
          az aks update --resource-group rgfiap --name aksfiap --api-server-authorized-ip-ranges "${CURRENT_RANGES},${RUNNER_IP}/32"

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/oficinamecanica-api/
          kubectl apply -f k8s/monitoring/

      # Optei por kubectl set image (em vez de editar o deployment.yaml
      # direto) para apontar pra tag do commit especifico que acabou de ser
      # publicada, em vez do ":latest" fixo no arquivo - resolve a pendencia
      # que o Sonar apontou (ver docs/sonarqube-report.md) sem o pipeline e o
      # Git brigarem pelo valor da tag no manifest.
      - name: Deploy new image
        run: |
          kubectl set image deployment/oficinamecanica-api api=acrfiap.azurecr.io/oficinamecanica-api:${{ github.sha }}
          kubectl rollout status deployment/oficinamecanica-api --timeout=180s

      # Roda mesmo se um passo anterior falhar (if: always()) - sem isso, o
      # IP efemero do runner ficaria liberado no firewall do API server
      # indefinidamente, ate a proxima execucao do workflow sobrescrever de
      # novo.
      - name: Restaura authorized IP ranges do AKS
        if: always()
        run: |
          az aks update --resource-group rgfiap --name aksfiap --api-server-authorized-ip-ranges "${{ env.AKS_ORIGINAL_IP_RANGES }}"
