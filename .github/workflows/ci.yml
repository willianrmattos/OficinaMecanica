# CI/CD independente do OficinaMecanica (OS Service). Mesmo desenho do Billing e da Execucao; o que muda de um servico para
# outro fica no bloco env abaixo, em scripts/ (variaveis no topo), em k8s/ e no Dockerfile.
#
# Cinco jobs encadeados:
#   build-and-test        "Build & Test" (check obrigatorio): build, testes dos scripts de CI, guardrail MassTransit, testes,
#                         cobertura com gate, OpenAPI
#   quality               "Quality" (check obrigatorio): SonarCloud com Quality Gate bloqueante
#   scan-image            so push/dispatch em main/release: build da imagem -> scan Trivy -> artifact (sem id-token)
#   build-and-push-image  so push/dispatch em main/release: carrega a MESMA imagem escaneada -> push no ACR (OIDC)
#   deploy-to-aks         so push/dispatch em main/release: migrations (dotnet ef database update, com a connection string
#                         lida do Key Vault) -> kubectl apply -> rollout
#
# Os passos de build/teste vivem em scripts/ (cobertura.sh, verificar-masstransit.sh, exportar-swagger.sh,
# validar-k8s.sh) e sao os mesmos que scripts/ci-local.sh roda na maquina do desenvolvedor, para depurar sem dar push.
#
# Autenticacao no Azure e so por OIDC (azure/login com a identidade desta repo, criada pelo OficinaMecanica.Infra):
# nenhum secret de longa duracao do Azure. O unico secret do repositorio e o SONAR_TOKEN, porque o SonarCloud nao
# suporta OIDC; ele so e lido pelo job quality.
#
# Todas as actions (de terceiros e do GitHub) estao fixadas por sha completo de commit, com a versao num comentario ao lado: a
# tag e mutavel e o sha nao. O Dependabot (github-actions) propoe as atualizacoes mantendo esse formato (ADR 0009).
name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

# Optei por cancelar a execucao anterior so em PR (economiza minutos). Em push/dispatch nunca cancelo: interromper um
# deploy no meio (migration aplicada, rollout pela metade) e pior do que esperar a execucao terminar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimo para todos os jobs; quem precisa de mais (checks, OIDC) declara no proprio job.
permissions:
  contents: read

env:
  # Tudo que muda de um servico para outro: aqui, em scripts/ (variaveis no topo), k8s/ e no Dockerfile.
  ACR_NAME: acrfiap
  IMAGE_NAME: oficinamecanica-api
  AKS_RESOURCE_GROUP: rgfiap
  AKS_CLUSTER: aksfiap
  K8S_NAMESPACE: default
  K8S_DIR: k8s/oficinamecanica-api
  K8S_DIR_MAILPIT: k8s/mailpit
  DEPLOYMENT: oficinamecanica-api
  CONTAINER: api
  KEY_VAULT: kvfiap
  SQL_SECRET_NAME: sql-connection-string
  SOLUTION: OficinaMecanica.sln
  EF_PROJECT: src/OficinaMecanica.Infrastructure
  EF_STARTUP_PROJECT: src/OficinaMecanica.API
  DOTNET_VERSION: 8.0.x
  # Gate de cobertura (% de linhas, numero "com exclusoes"); o scripts/cobertura.sh le esta variavel.
  COBERTURA_MINIMA: "80"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # dorny/test-reporter cria um check run com os resultados; sem esta permissao ele falha.
      checks: write
    env:
      # O build Release ja foi feito no step "Build"; os scripts de teste reaproveitam em vez de recompilar.
      COBERTURA_SEM_BUILD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      # Gate de cobertura e guardrail so provam algo se tambem REPROVAREM quando devem: este step exercita os dois (e o
      # ruleset, os demais scripts e a separacao de privilegios deste proprio workflow, via verificar-workflow.sh) com
      # entradas sinteticas e planta defeitos neles para conferir que os testes os detectam.
      - name: Testes dos scripts de CI (gate, guardrail e mutantes)
        run: bash scripts/testar-scripts.sh

      # MassTransit 9.x e comercial. Dependabot ja ignora o major, mas um pacote de terceiros pode arrastar o 9.x
      # como dependencia transitiva; so a resolucao real (dotnet list package) enxerga isso.
      - name: Guardrail MassTransit (major 8)
        run: bash scripts/verificar-masstransit.sh "$SOLUTION"

      # Antes dos testes (que demoram): manifest quebrado ou com campo invalido reprova em segundos.
      - name: Validar manifests do Kubernetes (kubeconform)
        run: bash scripts/validar-k8s.sh

      # Gera o OpenAPI da API compilada e falha se docs/openapi.json versionado estiver diferente: mudar um endpoint
      # sem atualizar o contrato publicado reprova o PR.
      - name: OpenAPI (exportar e conferir docs/openapi.json)
        run: bash scripts/exportar-swagger.sh --verificar --sem-build

      - name: Publicar openapi.json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi.json
          path: artifacts/openapi.json
          if-no-files-found: warn

      # Testes e cobertura rodam uma unica vez: o scripts/cobertura.sh ja coleta o OpenCover e o .trx em cada projeto.
      # Separados em dois steps so para o resultado de "sem Infra" e "Infra" aparecer em separado no log.
      - name: Testes (Category!=Infra)
        run: bash scripts/cobertura.sh testes-sem-infra

      # Testcontainers (SQL Server + RabbitMQ reais): o runner ubuntu-latest ja traz o Docker.
      - name: Testes (Category=Infra, Testcontainers)
        run: bash scripts/cobertura.sh testes-infra

      # Une todos os OpenCover, escreve os relatorios e FALHA se as linhas cobertas (com as exclusoes documentadas)
      # ficarem abaixo de COBERTURA_MINIMA.
      - name: Cobertura mesclada e gate
        run: bash scripts/cobertura.sh relatorio

      - name: Resumo de cobertura no Job Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f TestResults/resumo-cobertura.md ]; then
            cat TestResults/resumo-cobertura.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR de fork e PR do Dependabot recebem GITHUB_TOKEN somente leitura: o reporter nao consegue criar o check. Os
      # .trx continuam no artifact e o resultado dos testes continua no log do job.
      - name: Publicar resultados dos testes
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Resultados dos Testes
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Publicar resultados brutos dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-dos-testes
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Publicar relatorio HTML de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-de-cobertura
          path: |
            TestResults/report-com-exclusoes
            TestResults/report-bruto
          if-no-files-found: warn

      # O job quality importa estes arquivos no SonarCloud em vez de rodar os testes de novo.
      - name: Publicar OpenCover para o Quality
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-opencover
          path: TestResults/**/coverage.opencover.xml
          retention-days: 7
          if-no-files-found: error

  quality:
    name: "Quality"
    needs: build-and-test
    # PR vindo de fork nao recebe secrets (SONAR_TOKEN chega vazio), entao a analise nao tem como rodar. Pular e o
    # comportamento esperado: um check obrigatorio pulado conta como satisfeito, e o PR de fork continua passando pelo
    # "Build & Test" e por revisao.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # O SonarCloud nao suporta OIDC; o token fica como secret do repositorio e so os steps abaixo o recebem.
      SONAR_SCANNER_VERSION: 12.1.0
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      # Optei por falhar cedo e com mensagem clara: sem este step, a ausencia do token apareceria como um erro obscuro
      # do scanner ou, pior, o job passaria sem analisar nada.
      - name: Verificar configuracao do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          faltando=""
          [ -n "$SONAR_TOKEN" ] || faltando="$faltando secret:SONAR_TOKEN"
          [ -n "$SONAR_PROJECT_KEY" ] || faltando="$faltando variavel:SONAR_PROJECT_KEY"
          [ -n "$SONAR_ORGANIZATION" ] || faltando="$faltando variavel:SONAR_ORGANIZATION"
          if [ -n "$faltando" ]; then
            echo "::error title=SonarCloud nao configurado::Falta configurar no repositorio (Settings > Secrets and variables > Actions):$faltando. O check Quality e obrigatorio e nao pode passar sem a analise."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # O SonarCloud precisa do historico completo para atribuir o codigo novo (blame) e calcular o Quality Gate.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # O scanner e Java por baixo.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache pacotes do SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Instalar o scanner do SonarCloud
        run: dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"

      # A cobertura vem do job build-and-test (mesmo commit, mesmo caminho de workspace, entao os caminhos de arquivo
      # dentro do OpenCover continuam validos aqui).
      - name: Baixar o OpenCover do build-and-test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cobertura-opencover
          path: TestResults

      # O scanner instrumenta a compilacao: begin -> build -> end. O build precisa ser completo (--no-incremental)
      # e acontece neste job porque o do build-and-test nao passou pelo scanner.
      # As exclusoes de cobertura sao as mesmas do gate de cobertura (CLAUDE.md): Migrations, Program.cs,
      # DependencyInjection* e as EF Configurations. As Migrations tambem saem da analise de codigo (sao geradas), assim
      # como o script de carga em stress/ (k6) e o teste ponta a ponta local em e2e/ (Python e shell que sobem os tres
      # servicos no Docker): nao sao codigo do servico, e os argumentos de linha de comando deles vem de quem roda.
      # sonar.qualitygate.wait=true faz o "end" esperar o Quality Gate e FALHAR o job se ele reprovar.
      - name: Analise SonarCloud (begin, build, end)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/DependencyInjection*.cs,**/Data/Configurations/**" \
            /d:sonar.exclusions="**/Migrations/**,stress/**,e2e/**" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300
          dotnet build "$SOLUTION" --configuration Release --no-incremental
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Scan e push em jobs separados de proposito: o Trivy e as actions do Docker sao de terceiros, e o job de push tem
  # id-token: write (a identidade OIDC do servico tem AcrPush, AKS Cluster Admin e leitura do Key Vault). Qualquer step de
  # um job com id-token: write pode pedir o token OIDC; aqui o job que executa codigo de terceiros so tem contents: read,
  # entao nao tem como obter a identidade do Azure. O push so baixa a imagem ja aprovada, carrega no Docker e a empurra.
  scan-image:
    name: Scan Image (Trivy)
    # So depois de build/testes E de a qualidade aprovar. main e release publicam; PR nunca publica imagem.
    needs: [build-and-test, quality]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # A tag de deploy e sempre o sha do commit (imutavel). ":latest" so no push de main (producao): um push em
      # release nao pode sobrescrever o "latest" que reflete o que esta em producao.
      - name: Calcular tags
        id: meta
        run: |
          imagem="$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          echo "image=$imagem" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "latest=$ACR_NAME.azurecr.io/$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          fi

      # Optei por construir SEM push: a imagem so vai para o registry depois de passar no scan. load: true a deixa no
      # Docker local para o Trivy ler e para o docker save. provenance: false evita o manifest list de atestacao, que o
      # docker save/load nao carrega e que so confunde as ferramentas do ACR.
      - name: Build da imagem (local, sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reprova em vulnerabilidade HIGH/CRITICAL que ja tenha correcao publicada (ignore-unfixed: sem correcao
      # disponivel nao ha o que fazer no build). Tambem varre segredos esquecidos nas camadas.
      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # A imagem aprovada viaja como artifact para o job de push: o que o Trivy escaneou e exatamente o que vai para o
      # ACR (sem rebuild). Um dia de retencao basta; o artifact so existe para ligar os dois jobs.
      - name: Salvar a imagem escaneada
        env:
          IMAGE_SHA: ${{ steps.meta.outputs.image }}
        run: docker save "$IMAGE_SHA" --output imagem-escaneada.tar

      - name: Publicar a imagem escaneada (artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imagem-escaneada
          path: imagem-escaneada.tar
          retention-days: 1
          if-no-files-found: error

  build-and-push-image:
    name: Build & Push Docker Image
    needs: scan-image
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC: o job troca o token do GitHub por um token do Azure AD, sem secret de longa duracao. Este job so executa
      # actions do GitHub/Microsoft (download-artifact, azure/login) e comandos docker; nenhuma action de terceiros.
      id-token: write
      contents: read
    outputs:
      image: ${{ needs.scan-image.outputs.image }}
    env:
      IMAGE_SHA: ${{ needs.scan-image.outputs.image }}
      IMAGE_LATEST: ${{ needs.scan-image.outputs.latest }}
    steps:
      - name: Baixar a imagem escaneada
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: imagem-escaneada

      - name: Carregar a imagem no Docker
        run: docker load --input imagem-escaneada.tar

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name "$ACR_NAME"

      # Empurro a MESMA imagem que o Trivy escaneou (nao rebuildo), entao o que foi aprovado e o que vai para o ACR.
      - name: Push da imagem escaneada
        run: |
          docker push "$IMAGE_SHA"
          if [ -n "$IMAGE_LATEST" ]; then
            docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
            docker push "$IMAGE_LATEST"
          fi

  deploy-to-aks:
    # main (producao) e release (homologacao) fazem deploy para o MESMO Deployment e banco: o no unico do cluster nao
    # tem CPU para manter uma segunda instancia da aplicacao (ver README, secao "Ambiente de Homologacao"). A separacao
    # entre os dois e so de processo (branch protegida + PR obrigatorio), nao de infraestrutura isolada.
    name: Deploy to AKS
    needs: build-and-push-image
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
    # A concurrency do workflow e por ref, e main e release fazem deploy no MESMO Deployment: sem este grupo, um push em
    # cada uma delas poderia rodar migrations e rollouts ao mesmo tempo. cancel-in-progress: false enfileira em vez de
    # interromper um deploy no meio.
    concurrency:
      group: deploy-aks-oficinamecanica-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ needs.build-and-push-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Optei por aplicar o esquema do OficinaMecanicaDb aqui, antes do rollout: a API em Production nunca migra sozinha
      # (so em Development), e uma replica nova nao deve alterar o esquema por conta propria. A connection string vem do
      # Key Vault na mesma sessao OIDC (a identidade so tem "Key Vault Secrets User" neste secret) e nunca e impressa.
      # O dotnet-ef vem de dotnet-tools.json (mesma versao do EF Core do projeto).
      # Tento ate 5 vezes porque o Azure SQL serverless pausa por inatividade: a primeira conexao depois da pausa
      # falha com erro transitorio (40613) enquanto o banco acorda.
      - name: Aplicar migrations
        run: |
          set -euo pipefail
          dotnet tool restore
          conexao="$(az keyvault secret show --vault-name "$KEY_VAULT" --name "$SQL_SECRET_NAME" --query value -o tsv)"
          echo "::add-mask::$conexao"
          senha="$(printf '%s' "$conexao" | sed -nE 's/.*[Pp]assword=([^;]*).*/\1/p')"
          if [ -n "$senha" ]; then echo "::add-mask::$senha"; fi
          export ConnectionStrings__DefaultConnection="$conexao"
          export ASPNETCORE_ENVIRONMENT=Production
          for tentativa in 1 2 3 4 5; do
            if dotnet ef database update --configuration Release --project "$EF_PROJECT" --startup-project "$EF_STARTUP_PROJECT"; then
              exit 0
            fi
            echo "Tentativa $tentativa de 5 falhou; nova tentativa em 30 s (o Azure SQL pode estar acordando)."
            sleep 30
          done
          echo "::error title=Migrations::Nao foi possivel aplicar as migrations depois de 5 tentativas."
          exit 1

      # admin: true busca o kubeconfig das credenciais de administrador do cluster (contas locais do Kubernetes, sem
      # Azure RBAC de autorizacao dentro do cluster); exige a role "Azure Kubernetes Service Cluster Admin Role" na
      # identidade OIDC deste repositorio (modulo github_oidc_aks_app do OficinaMecanica.Infra).
      - name: Set AKS context
        uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: true

      # Os manifests tem um unico placeholder, ${IMAGE} (a imagem do sha). Optei por renderiza-lo antes do apply para o
      # Deployment ja nascer com a tag certa: se o manifest trouxesse outra tag, cada apply regrediria o Deployment e
      # dispararia dois rollouts. A lista explicita do envsubst impede que ele toque em qualquer outro "$" dos arquivos.
      - name: Renderizar manifests
        run: |
          set -euo pipefail
          # Imagem vazia (output do job de push ausente) falha aqui, antes de qualquer chamada ao apiserver.
          : "${IMAGE:?a imagem do job build-and-push-image veio vazia}"
          renderizado="$RUNNER_TEMP/k8s-renderizado"
          mkdir -p "$renderizado"
          for arquivo in "$K8S_DIR"/*.yaml; do
            nome="$(basename "$arquivo")"
            # shellcheck disable=SC2016  # as aspas simples sao de proposito: o envsubst recebe o nome, nao o valor
            envsubst '${IMAGE}' < "$arquivo" > "$renderizado/$nome"
          done
          # shellcheck disable=SC2016
          if grep -rn '\${' "$renderizado"; then
            echo "::error title=Manifests::Placeholder sem substituicao nos manifests renderizados."
            exit 1
          fi
          echo "K8S_RENDERIZADO=$renderizado" >> "$GITHUB_ENV"

      # O SecretProviderClass vai primeiro: o pod monta o volume CSI ao iniciar e, sem ele, ficaria em
      # ContainerCreating ate o objeto existir (so na primeira implantacao). O Mailpit (SMTP de demonstracao dentro do
      # cluster) nao tem placeholder e e aplicado como esta no repositorio.
      - name: Apply manifests
        run: |
          kubectl apply -f "$K8S_RENDERIZADO/secret-provider-class.yaml"
          kubectl apply -f "$K8S_RENDERIZADO/"
          kubectl apply -f "$K8S_DIR_MAILPIT/"

      # Mantenho o set image para fixar explicitamente a imagem do commit (idempotente: o apply acima ja a aplicou).
      # O timeout de 300 s cobre o pull da imagem, o mount do CSI e o startupProbe de ate 120 s; com maxSurge 0 e uma
      # replica, o rollout so termina quando o pod novo fica pronto.
      - name: Deploy new image
        run: |
          kubectl set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE" --namespace "$K8S_NAMESPACE"
          kubectl rollout status "deployment/$DEPLOYMENT" --namespace "$K8S_NAMESPACE" --timeout=300s

      # Describe de pod nao imprime valores de secret (so os nomes das chaves referenciadas).
      - name: Diagnostico do rollout
        if: ${{ failure() }}
        run: |
          kubectl get pods -l "app=$DEPLOYMENT" --namespace "$K8S_NAMESPACE" -o wide
          kubectl describe pods -l "app=$DEPLOYMENT" --namespace "$K8S_NAMESPACE"
          kubectl get events --namespace "$K8S_NAMESPACE" --sort-by=.lastTimestamp | tail -n 30
