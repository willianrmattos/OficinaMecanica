# Requer um Ingress Controller no cluster - ja instalado via Terraform
# (OficinaMecanica.Infra/helm/main.tf, helm_release do ingress-nginx).
#
# Deixei sem "host" na regra abaixo de proposito: e uma regra catch-all, que
# aceita qualquer hostname (ou nenhum) nao reivindicado por outra regra mais
# especifica - por isso o IP publico do ingress-nginx roteia direto para a
# API, sem necessidade de dominio. Ja no Mailpit (k8s/mailpit/ingress.yaml)
# usei host especifico (nip.io) porque os dois compartilham o mesmo IP e
# precisam ser diferenciados.
#
# Esse comportamento (bater no IP puro, sem host) e exatamente o que o
# Azure API Management (OficinaMecanica.Infra/apim/) usa como "service_url" - a APIM ficou
# na frente disso como novo front door pros clientes da API, mas continua
# chamando esse Ingress por baixo, sem mudar nada aqui.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficinamecanica-api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oficinamecanica-api
                port:
                  number: 80
