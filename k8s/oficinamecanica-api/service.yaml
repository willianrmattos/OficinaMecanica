# ClusterIP: a API so e alcancada pelo ingress-nginx (e, por ele, pela APIM); nada expoe o pod direto na internet. A porta
# e nomeada (http) porque o deployment.yaml referencia as probes por nome.
apiVersion: v1
kind: Service
metadata:
  name: oficinamecanica-api
  namespace: default
  labels:
    app: oficinamecanica-api
spec:
  type: ClusterIP
  selector:
    app: oficinamecanica-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
