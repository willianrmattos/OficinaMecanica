# Le os 3 segredos da aplicacao direto do Key Vault (kvfiap), usando a
# managed identity do proprio addon do CSI Secrets Store driver (nao criei
# uma Workload Identity dedicada pra manter o escopo simples - o addon ja
# tem "Key Vault Secrets User" no kvfiap desde a criacao do modulo aks).
#
# userAssignedIdentityID e tenantId sao valores estaveis (nao mudam a nao
# ser que o cluster/Key Vault seja recriado do zero) - obtidos via
# "terraform output key_vault_secrets_provider_client_id" e
# "terraform output azure_tenant_id" (infra/, apos aplicar o modulo aks).
#
# secretObjects sincroniza automaticamente esses valores pro Secret nativo
# "oficinamecanica-secrets" - o deployment.yaml continua lendo esse Secret
# via secretKeyRef, sem nenhuma mudanca nos nomes/chaves ja usados. A
# sincronizacao so acontece enquanto pelo menos um pod monta este
# SecretProviderClass como volume (ver deployment.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oficinamecanica-secrets-provider
spec:
  provider: azure
  secretObjects:
    - secretName: oficinamecanica-secrets
      type: Opaque
      data:
        - objectName: sql-connection-string
          key: sql-connection-string
        - objectName: jwt-secret-key
          key: jwt-secret-key
        - objectName: admin-senha
          key: admin-senha
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "037343e8-75c0-44d8-bbc4-0074c58402bb"
    keyvaultName: kvfiap
    tenantId: "a1016065-4e6c-4347-b374-25543c9a3425"
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: admin-senha
          objectType: secret
