# Le os segredos da aplicacao direto do Key Vault (kvfiap) pelo CSI Secrets Store driver, usando a managed identity do
# proprio addon do cluster (o addon ja tem "Key Vault Secrets User" no kvfiap desde a criacao do modulo aks); nao criei
# Workload Identity propria para manter o escopo simples.
#
# userAssignedIdentityID e tenantId sao identificadores estaveis (nao sao segredos): mudam so se o cluster ou o Key Vault
# forem recriados do zero. Vem de "terraform output key_vault_secrets_provider_client_id" e "terraform output
# azure_tenant_id" no OficinaMecanica.Infra, e sao os mesmos literais dos manifests do Billing e da Execucao.
#
# Listo so os 3 secrets que este servico usa: a connection string do OficinaMecanicaDb e as credenciais do RabbitMQ
# (gravadas no Key Vault pelo OficinaMecanica.Infra, messaging_keyvault.tf). Cada servico monta o proprio
# SecretProviderClass so com o que consome; a identidade do addon enxerga o vault inteiro, entao essa separacao e de
# manifest, nao de permissao.
#
# secretObjects sincroniza os valores para o Secret nativo "oficinamecanica-secrets", que o deployment.yaml le por
# secretKeyRef. A sincronizacao so acontece enquanto algum pod monta este SecretProviderClass como volume (ver
# deployment.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oficinamecanica-secrets-provider
  namespace: default
  labels:
    app: oficinamecanica-api
spec:
  provider: azure
  secretObjects:
    - secretName: oficinamecanica-secrets
      type: Opaque
      data:
        - objectName: sql-connection-string
          key: sql-connection-string
        - objectName: rabbitmq-username
          key: rabbitmq-username
        - objectName: rabbitmq-password
          key: rabbitmq-password
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "037343e8-75c0-44d8-bbc4-0074c58402bb"
    keyvaultName: kvfiap
    tenantId: "a1016065-4e6c-4347-b374-25543c9a3425"
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
        - |
          objectName: rabbitmq-username
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
