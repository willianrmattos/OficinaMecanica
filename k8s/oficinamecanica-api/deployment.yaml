apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficinamecanica-api
  labels:
    app: oficinamecanica-api
spec:
  # Defini um valor inicial apenas - a partir daqui a contagem de replicas e
  # controlada pelo HorizontalPodAutoscaler (k8s/oficinamecanica-api/hpa.yaml),
  # entre minReplicas e maxReplicas.
  replicas: 2
  # maxSurge: 0 porque o node unico do cluster (OficinaMecanica.Infra/aks) nao tem CPU sobrando
  # pra criar um pod extra durante o rollout (o padrao do Kubernetes, 25%,
  # arredonda pra +1 pod pra cima da contagem atual) - isso fazia o
  # "Deploy new image" do CI/CD (.github/workflows/ci.yml) travar esperando um
  # pod novo que nunca conseguia ser agendado (Insufficient cpu). Com
  # maxSurge: 0, o rollout derruba um pod antigo antes de criar o novo, nunca
  # excedendo a contagem atual de replicas.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: oficinamecanica-api
  template:
    metadata:
      labels:
        app: oficinamecanica-api
    spec:
      # Nao configurei imagePullSecrets: o kubelet do AKS ja possui permissao
      # de pull no ACR via role assignment (OficinaMecanica.Infra/aks/main.tf).
      # A API nao precisa falar com a API do Kubernetes, entao desabilitei o
      # automount do token da service account (reduz superficie de ataque).
      automountServiceAccountToken: false
      containers:
        - name: api
          image: acrfiap.azurecr.io/oficinamecanica-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: JwtSettings__Issuer
              value: "OficinaMecanica.Seguranca"
            - name: JwtSettings__Audience
              value: "OficinaMecanica.Client"
            - name: JwtSettings__JwksUri
              value: "https://apimfiap.azure-api.net/segurancaserver/.well-known/jwks.json"
            - name: Smtp__Host
              value: "mailpit"
            - name: Smtp__Port
              value: "1025"
            - name: Smtp__Remetente
              value: "no-reply@oficinamecanica.local"
            - name: Otel__Endpoint
              value: "http://jaeger.monitoring.svc.cluster.local:4317"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: sql-connection-string
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          # So preciso desse volume montado pra disparar a sincronizacao do
          # CSI Secrets Store driver (ver secret-provider-class.yaml) - o
          # container em si nao le nada desse caminho, os valores continuam
          # chegando via secretKeyRef acima, a partir do Secret nativo que o
          # driver mantem atualizado.
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficinamecanica-secrets-provider
