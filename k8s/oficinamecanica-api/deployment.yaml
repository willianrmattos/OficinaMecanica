apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficinamecanica-api
  labels:
    app: oficinamecanica-api
spec:
  # Defini um valor inicial apenas - a partir daqui a contagem de replicas e
  # controlada pelo HorizontalPodAutoscaler (k8s/oficinamecanica-api/hpa.yaml),
  # entre minReplicas e maxReplicas.
  replicas: 2
  selector:
    matchLabels:
      app: oficinamecanica-api
  template:
    metadata:
      labels:
        app: oficinamecanica-api
    spec:
      # Nao configurei imagePullSecrets: o kubelet do AKS ja possui permissao
      # de pull no ACR via role assignment (infra/aks/main.tf).
      # A API nao precisa falar com a API do Kubernetes, entao desabilitei o
      # automount do token da service account (reduz superficie de ataque).
      automountServiceAccountToken: false
      containers:
        - name: api
          image: acrfiap.azurecr.io/oficinamecanica-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: JwtSettings__Issuer
              value: "OficinaMecanica.API"
            - name: JwtSettings__Audience
              value: "OficinaMecanica.Client"
            - name: JwtSettings__ExpiracaoMinutos
              value: "60"
            - name: AdminCredentials__Usuario
              value: "admin"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: sql-connection-string
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: jwt-secret-key
            - name: AdminCredentials__Senha
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: admin-senha
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
