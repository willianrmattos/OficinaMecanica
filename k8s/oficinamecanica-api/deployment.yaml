# Deployment do OficinaMecanica (OS Service) no namespace default. Deixei um unico placeholder, ${IMAGE}: o CI o
# substitui por envsubst pela imagem do commit (acrfiap.azurecr.io/oficinamecanica-api:<sha>); aplicado sem substituir, o
# pod falha com nome de imagem invalido em vez de implantar uma tag qualquer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficinamecanica-api
  namespace: default
  labels:
    app: oficinamecanica-api
spec:
  # Omiti "replicas" de proposito: a contagem e do HorizontalPodAutoscaler (hpa.yaml, 1 a 2). Um valor aqui seria
  # reaplicado a cada deploy e derrubaria a replica extra que o HPA tivesse criado.
  revisionHistoryLimit: 3
  # Usei maxSurge: 0 porque o no unico do cluster (Standard_D4as_v4, OficinaMecanica.Infra/aks) nao tem CPU de requests
  # sobrando para um pod extra durante o rollout (um pod surge ficaria Pending por Insufficient cpu e o "rollout status" do
  # CI nunca terminaria). Com uma replica isso significa uma janela sem pod entre o antigo sair e o novo ficar pronto (ate
  # o startupProbe passar): as chamadas HTTP desse intervalo falham, mas nenhuma mensagem da saga se perde, porque os
  # eventos e comandos esperam nas filas do RabbitMQ e o sweeper de prazos retoma sozinho na partida.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: oficinamecanica-api
  template:
    metadata:
      labels:
        app: oficinamecanica-api
    spec:
      # Desabilitei o token da service account porque a API nao fala com a API do Kubernetes: um comprometimento do
      # processo nao ganha credencial de cluster. O pull da imagem no ACR vem do kubelet (role AcrPull do AKS),
      # por isso nao configurei imagePullSecrets.
      automountServiceAccountToken: false
      # O host do .NET espera ate 30 s pelo desligamento (consumers em andamento terminam e o MassTransit para o bus);
      # 40 s evita o SIGKILL chegar junto com o fim desse prazo.
      terminationGracePeriodSeconds: 40
      # 1654 e o usuario "app" da imagem aspnet:8.0 (o Dockerfile usa USER $APP_UID); o runAsNonRoot exige UID numerico.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Production (nunca Development): Development liga a migration automatica e permite o transporte em memoria.
            # O esquema do banco e aplicado pelo CI (job deploy-to-aks) antes do rollout.
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # O SqlClient precisa da cultura en-us: com a globalizacao invariante a conexao com o banco falha.
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            # Sao os padroes do codigo; deixei explicitos porque o validador da partida recusa EmMemoria/Nenhuma fora de
            # Development/Testing e uma mudanca acidental destes dois valores deve aparecer no diff do manifest.
            - name: Mensageria__Transporte
              value: "RabbitMq"
            - name: Mensageria__Persistencia
              value: "EntityFramework"
            # Broker do namespace messaging (OficinaMecanica.Infra/helm/rabbitmq.tf).
            - name: RabbitMq__Host
              value: "rabbitmq.messaging.svc.cluster.local"
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__VirtualHost
              value: "/"
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: rabbitmq-username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: rabbitmq-password
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: oficinamecanica-secrets
                  key: sql-connection-string
            # A consulta sincrona a Execucao (leitura do estado da producao, repassando o token do chamador) vai ao Service
            # da Execucao por HTTP dentro do cluster. O Service escuta na porta 80 e o pod da Execucao ve o path original: o
            # prefixo /execucao so existe no ingress, que esta chamada nao atravessa.
            - name: Execucao__BaseUrl
              value: "http://oficinamecanica-execucao.default.svc.cluster.local:80"
            # Iguais aos padroes do appsettings.json; deixei explicitos para uma mudanca de prazo de negocio ou o
            # desligamento do sweeper aparecerem no diff do manifest. SweeperHabilitado so existe para os testes.
            - name: Saga__PrazoAprovacaoHoras
              value: "72"
            - name: Saga__PrazoPagamentoHoras
              value: "48"
            - name: Saga__SweeperIntervaloSegundos
              value: "30"
            - name: Saga__SweeperLote
              value: "50"
            - name: Saga__SweeperHabilitado
              value: "true"
            - name: JwtSettings__Issuer
              value: "OficinaMecanica.Seguranca"
            - name: JwtSettings__Audience
              value: "OficinaMecanica.Client"
            - name: JwtSettings__JwksUri
              value: "https://apimfiap.azure-api.net/segurancaserver/.well-known/jwks.json"
            - name: Smtp__Host
              value: "mailpit"
            - name: Smtp__Port
              value: "1025"
            - name: Smtp__Remetente
              value: "no-reply@oficinamecanica.local"
            # Os contadores (Add()) exportados com temporalidade cumulativa (padrao do SDK) aparecem sempre zerados na New
            # Relic: o backend delas nao converte cumulativo em delta de forma confiavel para metricas customizadas. Delta
            # e o que ela recomenda; o Histogram (tempo_execucao_horas) funciona com o padrao e nao precisa disso.
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: "delta"
            # Aponta para o OpenTelemetry Collector (OficinaMecanica.Infra/helm/otel-collector.tf), que reexporta para a New
            # Relic via OTLP: trocar de backend de observabilidade so exige mudar a configuracao do Collector.
            - name: Otel__Endpoint
              value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
          # /health e liveness puro (responde sem tocar em banco nem broker) e /health/ready, a prontidao: abre conexao com o
          # SQL Server (503 so com o banco fora, porque sem ele a API nao aceita escrita) e com o RabbitMQ (broker fora =
          # Degraded, que continua 200: o outbox segura as mensagens e tirar o pod de rotacao por causa do broker viraria
          # indisponibilidade total). O Kestrel so abre a porta depois de os hosted services subirem, e o MassTransit
          # (WaitUntilStarted) segura a partida ate o bus conectar no RabbitMQ, ate 60 s (Mensageria:TimeoutDeInicioSegundos):
          # com o broker lento ou fora, /health nao responde ate la. Por isso o startupProbe (em /health) tem 120 s
          # (24 x 5 s), o dobro desse teto; so depois dele liveness e readiness passam a valer. Os checks de prontidao
          # (banco e broker, em paralelo) levam ate 3 s e o timeout padrao do Kubernetes e 1 s, por isso a readiness tem
          # timeoutSeconds: 5. O resultado da prontidao fica em cache de 5 s (Health:ProntidaoCacheSegundos, menor que o
          # periodo, entao cada probe ve uma medicao nova) porque o endpoint e anonimo e alcancavel pela APIM. O
          # periodSeconds de 30 so limita a carga das probes (uma conexao SQL e uma AMQP por avaliacao); nao e ele que
          # mantem o Azure SQL acordado, porque o outbox do MassTransit e o sweeper de prazos ja consultam o banco em
          # intervalos curtos. A liveness usa o mesmo periodo para a CPU limitada do no nao marcar o pod como morto por uma
          # resposta lenta isolada.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # CPU e o recurso escasso do no unico (os requests do cluster quase chegam ao total), por isso o limite de 500m
          # so protege os vizinhos. Mantive os valores que o monolito ja usava (100m / 256Mi de request, 512Mi de limite)
          # em vez de reduzi-los ao tamanho do Billing e da Execucao. Medido no container (512 MiB e 0,5 CPU, Production,
          # SQL Server e RabbitMQ reais), a API usa cerca de 95 MiB em repouso e 125 MiB depois de 400 requisicoes, entao a
          # memoria caberia em menos; mas este servico acumula a API HTTP, o orquestrador da saga (state machine, consumers,
          # outbox/inbox) e o sweeper de prazos, e a CPU sob mensagens reais dos tres servicos nao foi medida: sem essa
          # evidencia nao reduzi. O HPA (70% de CPU, 80% de memoria sobre estes requests) segura o teto de 2 replicas.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            # Root somente leitura; /tmp gravavel e onde o .NET e as bibliotecas colocam arquivos temporarios e o socket de
            # diagnostico do runtime. O Data Protection cai em chaves efemeras (aviso na partida) porque o home do usuario
            # tambem e somente leitura: a API so valida JWT, nao protege cookie nem antiforgery.
            - name: tmp
              mountPath: /tmp
            # So preciso do volume montado para o driver sincronizar o Secret oficinamecanica-secrets (ver
            # secret-provider-class.yaml); o container nao le nada deste caminho, os valores chegam por secretKeyRef.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficinamecanica-secrets-provider
