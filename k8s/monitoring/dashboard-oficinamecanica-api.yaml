# Criei este dashboard como codigo (ver infra/helm/monitoring.yaml.tpl,
# grafana.sidecar.dashboards): o sidecar do Grafana monitora ConfigMaps com o
# label abaixo em qualquer namespace e os importa automaticamente, sem
# necessidade de qualquer acao manual na UI. A fonte da verdade e este
# arquivo, versionado no repositorio.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-oficinamecanica-api
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  oficinamecanica-api.json: |
    {
      "title": "OficinaMecanica API",
      "uid": "oficinamecanica-api",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Taxa de requisicoes (por status HTTP)",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{job=\"oficinamecanica-api\"}[5m])) by (code)",
              "legendFormat": "HTTP {{code}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Latencia (p50 / p95 / p99)",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"oficinamecanica-api\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"oficinamecanica-api\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"oficinamecanica-api\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requisicoes em andamento",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress{job=\"oficinamecanica-api\"})",
              "legendFormat": "em andamento"
            }
          ]
        },
        {
          "id": 4,
          "title": "Taxa de erro (5xx)",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{job=\"oficinamecanica-api\", code=~\"5..\"}[5m]))",
              "legendFormat": "5xx/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "Replicas (Deployment)",
          "type": "stat",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas{deployment=\"oficinamecanica-api\"}",
              "legendFormat": "replicas"
            }
          ]
        },
        {
          "id": 6,
          "title": "CPU por pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 6, "w": 9, "x": 6, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"oficinamecanica-api-.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Memoria por pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 6, "w": 9, "x": 15, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\", pod=~\"oficinamecanica-api-.*\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
