# Criei este recurso para indicar ao Prometheus (instalado via
# OficinaMecanica.Infra/helm/monitoring.tf) onde buscar metricas do oficinamecanica-api. Sem
# isso, mesmo com a API expondo /metrics, o Prometheus nao sabe que precisa
# fazer scrape neste endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oficinamecanica-api
  namespace: monitoring
  labels:
    # Label obrigatorio: por padrao o kube-prometheus-stack so descobre
    # ServiceMonitors com o label "release: <nome do helm release>"
    # (serviceMonitorSelectorNilUsesHelmValues, default do chart). Usei
    # "monitoring" porque foi o nome que dei ao Helm release
    # (var.monitoring_release_name).
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default   # onde o Service oficinamecanica-api de fato roda
  selector:
    matchLabels:
      app: oficinamecanica-api
  endpoints:
    - port: http   # nome da porta em k8s/oficinamecanica-api/service.yaml
      path: /metrics
      interval: 30s
